<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Vision | Main Terminal</title>
    <style>
        :root { --primary: #00e5ff; --bg: #0a0c10; --text: #e0e0e0; }
        body { margin: 0; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; padding: 15px 0; text-align: center; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--primary); margin-bottom: 20px; }
        header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 4px; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .card { width: 90%; max-width: 400px; background: rgba(255,255,255,0.05); padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 20px; }
        .camera-box { position: relative; width: 100%; height: 250px; background: #000; border-radius: 8px; border: 2px solid rgba(0, 229, 255, 0.3); overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* Mirror effect */ }
        .laser { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--primary); box-shadow: 0 0 15px var(--primary); animation: scan 3s infinite ease-in-out; }
        @keyframes scan { 0%, 100% { top: 5%; } 50% { top: 95%; } }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-in { background: #0078d4; color: white; }
        .btn-out { background: transparent; border: 1px solid #ff4b4b; color: #ff4b4b; }
        button:hover { filter: brightness(1.2); }
        #status { text-align: center; font-size: 0.8rem; padding: 10px; border-left: 3px solid var(--primary); background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<header>
    <h1>SENTINEL VISION</h1>
    <p style="margin:0; font-size: 0.8rem; opacity: 0.6;">BIOMETRIC TERMINAL</p>
</header>

<div class="card">
    <div class="camera-box">
        <div class="laser"></div>
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="btn-group">
        <button class="btn-in" onclick="processAuth('TIME_IN')">Time In</button>
        <button class="btn-out" onclick="processAuth('TIME_OUT')">Time Out</button>
    </div>

    <div id="status">SYS: AWAITING BIOMETRIC SCAN</div>
</div>

<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => video.srcObject = stream);

    async function processAuth(type) {
        status.innerText = "SYS: SCANNING BIOMETRICS...";
        
        // Take a snapshot
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64Image = canvas.toDataURL('image/jpeg', 0.8);

        try {
            const res = await fetch('/api/SubmitAttendance', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: type, imageBase64: base64Image })
            });
            const data = await res.json();
            status.innerText = `SYS: ${data.message}`;
        } catch (e) {
            status.innerText = "SYS: OFFLINE OR SERVER ERROR";
        }
    }
</script>
</body>
</html>
